name: glauth
base: bare
build-base: ubuntu@22.04
version: "2.5.5"
summary: GLAuth
description: |
  GLAuth LDAP authentication server
license: Apache-2.0
run-user: _daemon_
platforms:
  amd64:
  arm64:
services:
  glauth:
    override: replace
    command: glauth -c /etc/config/glauth.cfg
    startup: enabled
parts:
  config:
    plugin: dump
    source: ./config
    source-type: local
    organize:
      glauth.cfg: etc/config/
    stage:
      - etc/config/glauth.cfg
  libc:
    plugin: nil
    stage-packages:
      - libc6_libs
  glauth:
    plugin: make
    build-snaps:
      - go/1.26/stable
    source: https://github.com/glauth/glauth
    source-type: git
    source-tag: GLAuth-v2.5.5
    source-subdir: v2
    override-pull: |
      git config --global url."https://github.com/".insteadOf git@github.com:
      git config -l
      craftctl default
    override-build: |
      export GOARCH="${CRAFT_ARCH_BUILD_FOR}"

      echo "###### patch CVEs #######"
      cd $CRAFT_PART_SRC_WORK
      # GO-2026-6612/6617: HTTP/2 races fixed in x/net v0.60.0;
      # glauth v2.5.5 still pins v0.58.0. All other former pins are
      # already satisfied by upstream.
      go get -u golang.org/x/net@v0.60.0

      cd -
      echo "#########################"

      U=https://github.com/glauth/glauth-postgres \
        M=pkg/plugins/glauth-postgres \
        make -C $CRAFT_PART_SRC_WORK pull-plugin-dependencies

      PLUGIN_ARCH=$GOARCH \
        make -C $CRAFT_PART_SRC_WORK -j$CRAFT_PARALLEL_BUILD_COUNT \
        plugin_postgres_linux_$GOARCH linux$GOARCH

      mkdir -p $CRAFT_PART_INSTALL/bin
      cp -r $CRAFT_PART_SRC_WORK/bin/*/{glauth,postgres.so} \
        $CRAFT_PART_INSTALL/bin/
    stage:
      - bin/glauth
      - bin/postgres.so
  deb-security-manifest:
    plugin: make
    after:
      - libc
    source: https://github.com/canonical/rocks-security-manifest
    source-type: git
    source-branch: main
    override-prime: gen_manifest
